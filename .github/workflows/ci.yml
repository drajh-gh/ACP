name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  control-plane-gates:
    name: Compiler, domain, storage, and repository gates
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies without lifecycle scripts
        run: bash scripts/codex-cloud-setup.sh

      - name: Type-check all TypeScript workspaces
        run: npm run typecheck

      - name: Run local contract and store tests
        run: npm test

      - name: Scan candidate files for common secret formats
        run: npm run check:secrets
